<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarjeta de Perfil</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid d-flex justify-content-center align-items-center vh-100 bg-light">

    <img src="../actividad-02-tarjeta/images/code.jpg"

    <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
      <span class="badge bg-primary">HTML</span>
      <span class="badge bg-success">CSS</span>
      <span class="badge bg-danger">JavaScript</span>
      <span class="badge bg-info">Bootstrap</span>
      <span class="badge bg-black">Express</span>
