<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieReviews | Reseña</title>
    <!-- Bootstrap 5 CSS y Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- CSS personalizado mínimo -->
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="detail" class="bg-light text-dark">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 text-white" href="index.html">🍿 MovieReviews</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <button class="btn btn-link nav-link text-white-50 me-auto position-relative border-0 bg-transparent py-2" data-bs-toggle="modal" data-bs-target="#favoritesModal">
                    <i class="bi bi-heart-fill text-danger me-1"></i> Favoritos
                    <span class="badge bg-primary rounded-pill favorite-count ms-1">0</span>
                </button>
                <a class="btn btn-outline-light btn-sm mt-2 mt-lg-0" href="index.html">
                    <i class="bi bi-arrow-left"></i> Volver al inicio
                </a>
            </div>
        </div>
    </nav>

    <!-- Modal de Mis Favoritos Bootstrap -->
    <div class="modal fade" id="favoritesModal" tabindex="-1" aria-labelledby="favoritesModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-dark text-white border-0">
                    <h5 class="modal-title fw-bold" id="favoritesModalLabel">Mis favoritos (<span class="favorite-count">0</span>)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body p-4 bg-light">
                    <div class="row g-3" id="favoritesGrid"></div>
                    <div id="noFavorites" class="text-center py-4">
                        <i class="bi bi-heartbreak text-muted display-4 mb-2 d-block"></i>
                        <p class="text-muted mb-0">Aún no tienes películas favoritas.</p>
                    </div>
                </div>
                <div class="modal-footer border-0 bg-white">
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" id="clearFavorites" class="btn btn-danger btn-sm" disabled>Eliminar todos</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Contenedor Principal del Detalle -->
    <main class="container my-5">
        
        <!-- Estado: Cargando Detalle -->
        <div id="detailLoading" class="text-center py-5">
            <div class="spinner-border text-primary mb-3" role="status"></div>
            <p class="text-muted">Cargando reseña...</p>
        </div>

        <!-- Estado: Error en película -->
        <div id="detailError" class="text-center py-5 d-none">
            <div class="card mx-auto p-4 border-0 shadow-sm bg-white" style="max-width: 450px;">
                <div class="card-body">
                    <i class="bi bi-search text-muted display-4 mb-2"></i>
                    <h3 class="h5 fw-bold">No se encontró la película solicitada</h3>
                    <p class="text-muted small">El identificador de IMDb es inválido o no existe en el sistema local.</p>
                    <a class="btn btn-primary btn-sm mt-3" href="index.html">Volver al inicio</a>
                </div>
            </div>
        </div>

        <!-- Ficha de la película (Renderizado dinámico completo por app.js) -->
        <article id="movieDetail" class="card border-0 shadow-sm overflow-hidden bg-white d-none detail-shell">
            <!-- La función renderDetail() inyectará aquí los nodos de Bootstrap correspondientes -->
        </article>

    </main>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
